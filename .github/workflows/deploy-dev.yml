name: Deploy dev

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image names
        shell: bash
        run: |
          echo "FASTAPI_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/fastapi:develop" >> "$GITHUB_ENV"
          echo "BACKEND_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/spring-boot-server:develop" >> "$GITHUB_ENV"

      - name: Copy compose files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml,nginx/default.conf,.env.example"
          target: "/opt/lol-chatbot"
          overwrite: true

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          FASTAPI_IMAGE: ${{ env.FASTAPI_IMAGE }}
          BACKEND_IMAGE: ${{ env.BACKEND_IMAGE }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: FASTAPI_IMAGE,BACKEND_IMAGE,GHCR_TOKEN,GHCR_USERNAME,GEMINI_API_KEY,GEMINI_MODEL
          script: |
            set -e
            cd /opt/lol-chatbot
            if [ ! -f .env ]; then
              cp .env.example .env
            fi
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            BACKEND_IMAGE="$BACKEND_IMAGE" FASTAPI_IMAGE="$FASTAPI_IMAGE" docker compose pull
            BACKEND_IMAGE="$BACKEND_IMAGE" FASTAPI_IMAGE="$FASTAPI_IMAGE" GEMINI_API_KEY="$GEMINI_API_KEY" GEMINI_MODEL="$GEMINI_MODEL" docker compose up -d
            docker image prune -f
            sleep 10
            curl -fsS http://localhost/actuator/health
